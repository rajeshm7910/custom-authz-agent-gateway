syntax = "proto3";

package envoy.type.v3;

enum StatusCode {
  Empty = 0;
  Continue = 100;
  OK = 200;
  Created = 201;
  Accepted = 202;
  BadRequest = 400;
  Unauthorized = 401;
  Forbidden = 403;
  NotFound = 404;
  InternalServerError = 500;
  ServiceUnavailable = 503;
}

message HttpStatus {
  StatusCode code = 1;
}
