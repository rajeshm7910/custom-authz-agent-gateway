[project]
name = "custom-authz-service"
version = "0.1.0"
description = "Consolidated Custom Authz Service"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-health-checking>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "google-auth>=2.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
requires-python = ">=3.11"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
