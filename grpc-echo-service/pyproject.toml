[project]
name = "grpc-echo-service"
version = "0.1.0"
description = "Standalone Python gRPC Echo Service with Sensitive Data (SSN) Denial and Response Modification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
extraPaths = ["src", "src/generated"]
