syntax = "proto3";

package envoy.service.auth.v3;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "envoy/config/core/v3/base.proto";
import "envoy/type/v3/http_status.proto";

message HttpRequest {
  string id = 1;
  string method = 2;
  map<string, string> headers = 3;
  string path = 4;
  string host = 5;
  string scheme = 6;
  string query = 7;
  string fragment = 8;
  int64 size = 9;
  string body = 10;
  bytes raw_body = 11;
}

message Peer {
  string address = 1;
  uint32 port = 2;
}

message AttributeContext {
  Peer source = 1;
  Peer destination = 2;
  Request request = 3;
  map<string, string> context_extensions = 4;

  message Request {
    google.protobuf.Timestamp time = 1;
    HttpRequest http = 2;
  }
}

message OkHttpResponse {
  repeated envoy.config.core.v3.HeaderValueOption headers = 1;
  repeated string headers_to_remove = 2;
  repeated envoy.config.core.v3.HeaderValueOption response_headers_to_add = 3;
}

message DeniedHttpResponse {
  envoy.type.v3.HttpStatus status = 1;
  repeated envoy.config.core.v3.HeaderValueOption headers = 2;
  string body = 3;
}

message CheckRequest {
  AttributeContext attributes = 1;
}

message CheckResponse {
  google.rpc.Status status = 1;
  oneof http_response {
    DeniedHttpResponse denied_response = 2;
    OkHttpResponse ok_response = 3;
  }
}

service Authorization {
  rpc Check(CheckRequest) returns (CheckResponse);
}
